apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: invoice-generator
  namespace: argocd
spec:
  description: Invoice Generator cafe POS application
  sourceRepos:
    - "https://github.com/rashidraza2254-code/InvoiceGenerator-main"
  destinations:
    - namespace: invoice-generator
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: PersistentVolumeClaim
    - group: networking.k8s.io
      kind: Ingress
