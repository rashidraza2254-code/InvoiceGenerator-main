# Helm values for kube-prometheus-stack
# Install: helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
#            --namespace monitoring --create-namespace -f monitoring/prometheus-values.yaml

grafana:
  enabled: true
  adminPassword: "admin"   # Change via kubectl secret in prod
  service:
    type: LoadBalancer
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: invoice-app
          orgId: 1
          folder: "Invoice Generator"
          type: file
          options:
            path: /var/lib/grafana/dashboards/invoice-app
  dashboardsConfigMaps:
    invoice-app: "grafana-dashboards"

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    # Scrape the FastAPI backend pods via annotations
    additionalScrapeConfigs:
      - job_name: invoice-backend
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - invoice-generator
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"
    receivers:
      - name: "null"
