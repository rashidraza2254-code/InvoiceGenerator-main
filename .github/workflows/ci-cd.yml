name: CI/CD — Build, Test, GitOps Deploy via ArgoCD

on:
  push:
    branches: [main]
    # Don't re-trigger on the manifest-update commit ArgoCD watches for
    paths-ignore:
      - "k8s/overlays/**"
  pull_request:
    branches: [main]
  workflow_dispatch:   # Manual trigger for Terraform job

env:
  ACR_REGISTRY: invoicegenacr.azurecr.io    # from: terraform output acr_login_server
  K8S_NAMESPACE: invoice-generator

permissions:
  id-token: write    # OIDC login to Azure — no stored passwords
  contents: write    # Needed to commit image-tag updates back to Git

jobs:
  # ── Job 1: Test ────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        run: pytest backend/tests/ -v --tb=short --junitxml=test-results.xml
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: test_cafe_db
          JWT_SECRET: ci-test-secret-not-used-in-prod

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ── Job 2: Build & Push to ACR ────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag (short SHA)
        id: tag
        run: echo "value=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Login to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name invoicegenacr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/backend:${{ steps.tag.outputs.value }}
            ${{ env.ACR_REGISTRY }}/backend:latest
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/backend:cache
          cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/backend:cache,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/frontend:${{ steps.tag.outputs.value }}
            ${{ env.ACR_REGISTRY }}/frontend:latest
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/frontend:cache
          cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/frontend:cache,mode=max

  # ── Job 3: GitOps — update manifest, let ArgoCD deploy ───────────────────
  #
  # This is the GitOps pattern: CI never touches kubectl or the cluster.
  # Instead it commits the new image tag into Git.
  # ArgoCD (running on AKS) detects the commit and syncs the cluster.
  #
  gitops-update:
    name: Update Manifests (GitOps)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT or the built-in token — GITHUB_TOKEN is sufficient
          # for same-repo commits when 'contents: write' permission is set
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kustomize
        run: |
          curl -sLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.1/kustomize_v5.4.1_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/

      - name: Update image tags in Kustomize overlay
        run: |
          cd k8s/overlays/production
          kustomize edit set image \
            ${{ env.ACR_REGISTRY }}/backend=${{ env.ACR_REGISTRY }}/backend:${{ needs.build-and-push.outputs.image_tag }} \
            ${{ env.ACR_REGISTRY }}/frontend=${{ env.ACR_REGISTRY }}/frontend:${{ needs.build-and-push.outputs.image_tag }}

      - name: Commit and push manifest update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: deploy image tag ${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
          git push origin main

      # ArgoCD's automated syncPolicy (selfHeal: true) picks up the commit
      # and rolls out the new images within ~3 minutes.
      # The step below is optional — it lets the pipeline show sync status.
      - name: Wait for ArgoCD sync
        if: ${{ vars.ARGOCD_SERVER != '' }}
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
          argocd app wait invoice-generator \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_TOKEN" \
            --insecure \
            --timeout 180

  # ── Job 4: Infrastructure via Terraform (manual trigger only) ─────────────
  terraform:
    name: Terraform Plan / Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
